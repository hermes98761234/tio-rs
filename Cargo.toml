[package]
name = "tio-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "tio"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serialport = "4"
nix = { version = "0.29", features = ["term", "poll"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
